# templates/python/copier.yml
_subdirectory: template
_templates_suffix: .jinja

project_name:
  type: str
  help: Project name (human-readable)
  default: My Project

project_slug:
  type: str
  help: Project slug (directory name)
  default: "{{ project_name | lower | replace(' ', '-') }}"

package_name:
  type: str
  help: Python package name
  default: "{{ project_slug | replace('-', '_') }}"

python_version:
  type: str
  help: Python version
  default: "3.12"
  choices:
    - "3.12"
    - "3.11"
    - "3.10"

has_cli:
  type: bool
  help: Include CLI entry point?
  default: false

use_precommit:
  type: bool
  help: Enable pre-commit hooks?
  default: true

services:
  type: str
  help: Services (comma-separated)
  default: ""
  placeholder: "postgres,redis"
